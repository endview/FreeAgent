name: Release Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permanent-gates:
    name: Permanent public release gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      proof_complete: ${{ steps.finalize.outputs.run_succeeded }}
    steps:
      - name: Check out exact workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
          set-safe-directory: false

      - name: Prepare authenticated release workspace
        id: prepare
        shell: pwsh
        timeout-minutes: 15
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts/Invoke-CIWorkflowControl.ps1'
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $item.Length -gt 4194304) { throw 'Invalid workflow control file.' }
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -gt 4194304) { throw 'Workflow control file is too large.' }
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ($actual -cne '171ce947eb2e5d49efcd89476e2031dcf82719484f9fc381bebe3df90760b22d') {
            throw 'Workflow control authentication failed.'
          }
          $utf8 = New-Object Text.UTF8Encoding($false, $true)
          $source = $utf8.GetString($bytes)
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Workflow control parsing failed.' }
          $control = [ScriptBlock]::Create($source)
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $probe = $runnerTemp
          while (-not [string]::IsNullOrWhiteSpace($probe)) {
            if (Test-Path -LiteralPath $probe) {
              $probeItem = Get-Item -LiteralPath $probe -Force
              if (($probeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'Runner temp ancestry is not trusted.'
              }
            }
            $parent = [IO.Path]::GetDirectoryName($probe)
            if ([string]::IsNullOrWhiteSpace($parent) -or $parent -eq $probe) { break }
            $probe = $parent
          }
          $base = Join-Path $runnerTemp 'freeagent-release-job'
          if (Test-Path -LiteralPath $base) { throw 'Release workspace already exists.' }
          $controlDirectory = [IO.Directory]::CreateDirectory((Join-Path $base 'control')).FullName
          $snapshot = Join-Path $controlDirectory 'workflow-control.ps1'
          $stream = New-Object IO.FileStream(
            $snapshot,
            [IO.FileMode]::CreateNew,
            [IO.FileAccess]::Write,
            [IO.FileShare]::None
          )
          try {
            $stream.Write($bytes, 0, $bytes.Length)
            $stream.Flush($true)
          } finally { $stream.Dispose() }
          & $control `
            -Prepare `
            -JobKind permanent `
            -BaseRoot $base `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -Revision $env:GITHUB_SHA `
            -GitHubOutputPath $env:GITHUB_OUTPUT `
            -GitHubEnvironmentPath $env:GITHUB_ENV

      - name: Initialize authenticated job evidence
        id: initialize
        shell: pwsh
        timeout-minutes: 5
        env:
          CIWC_CONTROL_PATH: ${{ steps.prepare.outputs.control }}
          CIWC_BASE: ${{ steps.prepare.outputs.base }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = [IO.Path]::GetFullPath($env:CIWC_CONTROL_PATH)
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $item.Length -gt 4194304) { throw 'Invalid workflow control file.' }
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ($bytes.Length -gt 4194304 -or
              $actual -cne '171ce947eb2e5d49efcd89476e2031dcf82719484f9fc381bebe3df90760b22d') {
            throw 'Workflow control authentication failed.'
          }
          $source = (New-Object Text.UTF8Encoding($false, $true)).GetString($bytes)
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Workflow control parsing failed.' }
          & ([ScriptBlock]::Create($source)) `
            -Initialize -JobKind permanent -BaseRoot $env:CIWC_BASE

      - name: Set up Go from sealed go.mod
        id: setup
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ steps.prepare.outputs.stage }}/go.mod
          cache: false
          check-latest: false

      - name: Set up exact Node from sealed control-web policy
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          check-latest: false
          package-manager-cache: false

      - name: Authenticate external npm 12 tool
        id: setup-npm
        shell: pwsh
        timeout-minutes: 5
        env:
          FREEAGENT_NPM_TARBALL_URL: https://registry.npmjs.org/npm/-/npm-12.0.2.tgz
          FREEAGENT_NPM_TARBALL_SHA512: uIXokLlBj6FpNUTQX1PmT5pz7BlIN9QlixX+zdaSNHsd0qUXsbDLr50xzY6Sw7cJVr0uzHKDOle0swmPW/p5Qw==
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $root = Join-Path ([IO.Path]::GetFullPath($env:RUNNER_TEMP)) 'freeagent-npm-12.0.2'
          if (Test-Path -LiteralPath $root) { throw 'npm tool workspace already exists.' }
          [void][IO.Directory]::CreateDirectory($root)
          $archive = Join-Path $root 'npm-12.0.2.tgz'
          $handler = New-Object Net.Http.HttpClientHandler
          $handler.AllowAutoRedirect = $false
          $client = New-Object Net.Http.HttpClient($handler)
          try {
            $response = $client.GetAsync($env:FREEAGENT_NPM_TARBALL_URL).GetAwaiter().GetResult()
            if ([int]$response.StatusCode -ne 200) { throw 'npm tarball download failed.' }
            [byte[]]$bytes = $response.Content.ReadAsByteArrayAsync().GetAwaiter().GetResult()
          } finally {
            $client.Dispose()
            $handler.Dispose()
          }
          if ($bytes.Length -le 0 -or $bytes.Length -gt 16777216) {
            throw 'npm tarball size is invalid.'
          }
          $sha = [Security.Cryptography.SHA512]::Create()
          try { $actual = [Convert]::ToBase64String($sha.ComputeHash($bytes)) }
          finally { $sha.Dispose() }
          if ($actual -cne $env:FREEAGENT_NPM_TARBALL_SHA512) {
            throw 'npm tarball authentication failed.'
          }
          $stream = New-Object IO.FileStream(
            $archive,
            [IO.FileMode]::CreateNew,
            [IO.FileAccess]::Write,
            [IO.FileShare]::None
          )
          try {
            $stream.Write($bytes, 0, $bytes.Length)
            $stream.Flush($true)
          } finally { $stream.Dispose() }
          $extract = [IO.Directory]::CreateDirectory((Join-Path $root 'extract')).FullName
          $tar = Get-Command tar -CommandType Application -ErrorAction Stop | Select-Object -First 1
          & $tar.Source -xzf $archive -C $extract
          if ($LASTEXITCODE -ne 0) { throw 'npm tarball extraction failed.' }
          $cli = [IO.Path]::GetFullPath((Join-Path $extract 'package/bin/npm-cli.js'))
          $probe = $cli
          while (-not [string]::IsNullOrWhiteSpace($probe)) {
            $item = Get-Item -LiteralPath $probe -Force
            if (($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'npm CLI ancestry contains a reparse point.'
            }
            if ($probe -ceq $root) { break }
            $parent = [IO.Path]::GetDirectoryName($probe)
            if ([string]::IsNullOrWhiteSpace($parent) -or $parent -ceq $probe) {
              throw 'npm CLI escaped its authenticated workspace.'
            }
            $probe = $parent
          }
          $cliItem = Get-Item -LiteralPath $cli -Force
          if (-not ($cliItem -is [IO.FileInfo]) -or $cliItem.Length -gt 1048576) {
            throw 'npm CLI is invalid.'
          }
          $node = (Get-Command node -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $nodeVersion = (& $node --version | Out-String).Trim()
          $npmVersion = (& $node $cli --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $nodeVersion -cne 'v24.19.0' -or $npmVersion -cne '12.0.2') {
            throw 'Node or npm tool version is invalid.'
          }
          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "FREEAGENT_NPM_CLI=$cli`n",
            (New-Object Text.UTF8Encoding($false))
          )

      - name: Run authenticated permanent gates
        id: run
        if: ${{ !cancelled() && steps.initialize.outcome == 'success' && steps.setup.outcome == 'success' && steps.setup-node.outcome == 'success' && steps.setup-npm.outcome == 'success' }}
        shell: pwsh
        env:
          CIWC_CONTROL_PATH: ${{ steps.prepare.outputs.control }}
          CIWC_BASE: ${{ steps.prepare.outputs.base }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = [IO.Path]::GetFullPath($env:CIWC_CONTROL_PATH)
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $item.Length -gt 4194304) { throw 'Invalid workflow control file.' }
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ($bytes.Length -gt 4194304 -or
              $actual -cne '171ce947eb2e5d49efcd89476e2031dcf82719484f9fc381bebe3df90760b22d') {
            throw 'Workflow control authentication failed.'
          }
          $source = (New-Object Text.UTF8Encoding($false, $true)).GetString($bytes)
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Workflow control parsing failed.' }
          & ([ScriptBlock]::Create($source)) `
            -Run -JobKind permanent -BaseRoot $env:CIWC_BASE

      - name: Finalize authenticated job outputs
        id: finalize
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.initialize.outcome == 'success' && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') }}
        shell: pwsh
        timeout-minutes: 15
        env:
          CIWC_CONTROL_PATH: ${{ steps.prepare.outputs.control }}
          CIWC_BASE: ${{ steps.prepare.outputs.base }}
          CIWC_MANIFEST_SHA256: ${{ steps.prepare.outputs.manifest_sha256 }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = [IO.Path]::GetFullPath($env:CIWC_CONTROL_PATH)
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $item.Length -gt 4194304) { throw 'Invalid workflow control file.' }
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ($bytes.Length -gt 4194304 -or
              $actual -cne '171ce947eb2e5d49efcd89476e2031dcf82719484f9fc381bebe3df90760b22d') {
            throw 'Workflow control authentication failed.'
          }
          $source = (New-Object Text.UTF8Encoding($false, $true)).GetString($bytes)
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Workflow control parsing failed.' }
          & ([ScriptBlock]::Create($source)) `
            -Finalize `
            -JobKind permanent `
            -BaseRoot $env:CIWC_BASE `
            -ManifestSha256 $env:CIWC_MANIFEST_SHA256 `
            -GitHubOutputPath $env:GITHUB_OUTPUT

  linux-quality:
    name: Linux quality and ordinary tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      proof_complete: ${{ steps.finalize.outputs.run_succeeded }}
    steps:
      - name: Check out exact workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
          set-safe-directory: false

      - name: Prepare authenticated release workspace
        id: prepare
        shell: pwsh
        timeout-minutes: 15
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts/Invoke-CIWorkflowControl.ps1'
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
