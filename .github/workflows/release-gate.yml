          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Workflow control parsing failed.' }
          & ([ScriptBlock]::Create($source)) `
            -Seal `
            -JobKind linux-race `
            -BaseRoot $env:CIWC_BASE `
            -ManifestSha256 $env:CIWC_MANIFEST_SHA256 `
            -ExpectedArtifactSetSha256 $env:CIWC_ARTIFACT_SET_SHA256

  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - permanent-gates
      - linux-quality
      - windows
      - linux-race
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            binary: freeagent-windows-amd64.exe
          - goos: windows
            goarch: arm64
            binary: freeagent-windows-arm64.exe
          - goos: linux
            goarch: amd64
            binary: freeagent-linux-amd64
          - goos: linux
            goarch: arm64
            binary: freeagent-linux-arm64
          - goos: darwin
            goarch: amd64
            binary: freeagent-darwin-amd64
          - goos: darwin
            goarch: arm64
            binary: freeagent-darwin-arm64
    steps:
      - name: Check out exact workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false
          lfs: false
          clean: true
          set-safe-directory: false

      - name: Prepare authenticated release workspace
        id: prepare
        shell: pwsh
        timeout-minutes: 15
        env:
          CIWC_TARGET_GOOS: ${{ matrix.goos }}
          CIWC_TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts/Invoke-CIWorkflowControl.ps1'
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $item.Length -gt 4194304) { throw 'Invalid workflow control file.' }
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes.Length -gt 4194304) { throw 'Workflow control file is too large.' }
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ($actual -cne '171ce947eb2e5d49efcd89476e2031dcf82719484f9fc381bebe3df90760b22d') {
            throw 'Workflow control authentication failed.'
          }
          $source = (New-Object Text.UTF8Encoding($false, $true)).GetString($bytes)
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Workflow control parsing failed.' }
          $control = [ScriptBlock]::Create($source)
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $probe = $runnerTemp
          while (-not [string]::IsNullOrWhiteSpace($probe)) {
            if (Test-Path -LiteralPath $probe) {
              $probeItem = Get-Item -LiteralPath $probe -Force
              if (($probeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'Runner temp ancestry is not trusted.'
              }
            }
            $parent = [IO.Path]::GetDirectoryName($probe)
            if ([string]::IsNullOrWhiteSpace($parent) -or $parent -eq $probe) { break }
            $probe = $parent
          }
          $base = Join-Path $runnerTemp 'freeagent-release-job'
          if (Test-Path -LiteralPath $base) { throw 'Release workspace already exists.' }
          $controlDirectory = [IO.Directory]::CreateDirectory((Join-Path $base 'control')).FullName
          $snapshot = Join-Path $controlDirectory 'workflow-control.ps1'
          $stream = New-Object IO.FileStream(
            $snapshot,
            [IO.FileMode]::CreateNew,
            [IO.FileAccess]::Write,
            [IO.FileShare]::None
          )
          try {
            $stream.Write($bytes, 0, $bytes.Length)
            $stream.Flush($true)
          } finally { $stream.Dispose() }
          & $control `
            -Prepare `
            -JobKind cross-build `
            -BaseRoot $base `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -Revision $env:GITHUB_SHA `
            -GitHubOutputPath $env:GITHUB_OUTPUT `
            -GitHubEnvironmentPath $env:GITHUB_ENV `
            -TargetGoos $env:CIWC_TARGET_GOOS `
            -TargetGoarch $env:CIWC_TARGET_GOARCH

      - name: Initialize authenticated job evidence
        id: initialize
        shell: pwsh
        timeout-minutes: 5
        env:
          CIWC_CONTROL_PATH: ${{ steps.prepare.outputs.control }}
          CIWC_BASE: ${{ steps.prepare.outputs.base }}
          CIWC_TARGET_GOOS: ${{ matrix.goos }}
          CIWC_TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = [IO.Path]::GetFullPath($env:CIWC_CONTROL_PATH)
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $item.Length -gt 4194304) { throw 'Invalid workflow control file.' }
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ($bytes.Length -gt 4194304 -or
              $actual -cne '171ce947eb2e5d49efcd89476e2031dcf82719484f9fc381bebe3df90760b22d') {
            throw 'Workflow control authentication failed.'
          }
          $source = (New-Object Text.UTF8Encoding($false, $true)).GetString($bytes)
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Workflow control parsing failed.' }
          & ([ScriptBlock]::Create($source)) `
            -Initialize `
            -JobKind cross-build `
            -BaseRoot $env:CIWC_BASE `
            -TargetGoos $env:CIWC_TARGET_GOOS `
            -TargetGoarch $env:CIWC_TARGET_GOARCH

      - name: Set up Go from sealed go.mod
        id: setup
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ steps.prepare.outputs.stage }}/go.mod
          cache: false
          check-latest: false

      - name: Run authenticated cross build
        id: run
        if: ${{ !cancelled() && steps.initialize.outcome == 'success' }}
        shell: pwsh
        env:
          CIWC_CONTROL_PATH: ${{ steps.prepare.outputs.control }}
          CIWC_BASE: ${{ steps.prepare.outputs.base }}
          CIWC_TARGET_GOOS: ${{ matrix.goos }}
          CIWC_TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = [IO.Path]::GetFullPath($env:CIWC_CONTROL_PATH)
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $item.Length -gt 4194304) { throw 'Invalid workflow control file.' }
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ($bytes.Length -gt 4194304 -or
              $actual -cne '171ce947eb2e5d49efcd89476e2031dcf82719484f9fc381bebe3df90760b22d') {
            throw 'Workflow control authentication failed.'
          }
          $source = (New-Object Text.UTF8Encoding($false, $true)).GetString($bytes)
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Workflow control parsing failed.' }
          & ([ScriptBlock]::Create($source)) `
            -Run `
            -JobKind cross-build `
            -BaseRoot $env:CIWC_BASE `
            -TargetGoos $env:CIWC_TARGET_GOOS `
            -TargetGoarch $env:CIWC_TARGET_GOARCH

      - name: Finalize authenticated job outputs
        id: finalize
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.initialize.outcome == 'success' && (steps.run.outcome == 'success' || steps.run.outcome == 'failure') }}
        shell: pwsh
        timeout-minutes: 15
        env:
          CIWC_CONTROL_PATH: ${{ steps.prepare.outputs.control }}
          CIWC_BASE: ${{ steps.prepare.outputs.base }}
          CIWC_MANIFEST_SHA256: ${{ steps.prepare.outputs.manifest_sha256 }}
          CIWC_TARGET_GOOS: ${{ matrix.goos }}
          CIWC_TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = [IO.Path]::GetFullPath($env:CIWC_CONTROL_PATH)
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $item.Length -gt 4194304) { throw 'Invalid workflow control file.' }
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ($bytes.Length -gt 4194304 -or
              $actual -cne '171ce947eb2e5d49efcd89476e2031dcf82719484f9fc381bebe3df90760b22d') {
            throw 'Workflow control authentication failed.'
          }
          $source = (New-Object Text.UTF8Encoding($false, $true)).GetString($bytes)
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Workflow control parsing failed.' }
          & ([ScriptBlock]::Create($source)) `
            -Finalize `
            -JobKind cross-build `
            -BaseRoot $env:CIWC_BASE `
            -ManifestSha256 $env:CIWC_MANIFEST_SHA256 `
            -GitHubOutputPath $env:GITHUB_OUTPUT `
            -TargetGoos $env:CIWC_TARGET_GOOS `
            -TargetGoarch $env:CIWC_TARGET_GOARCH

      - name: Upload verified executable
        id: upload
        if: ${{ always() && steps.setup.outcome == 'success' && steps.run.outcome == 'success' && steps.finalize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freeagent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.prepare.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
          overwrite: false

      - name: Seal local artifact after upload attempt
        id: seal
        if: ${{ always() && steps.setup.outcome == 'success' && steps.run.outcome == 'success' && steps.finalize.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 15
        env:
          CIWC_CONTROL_PATH: ${{ steps.prepare.outputs.control }}
          CIWC_BASE: ${{ steps.prepare.outputs.base }}
          CIWC_MANIFEST_SHA256: ${{ steps.prepare.outputs.manifest_sha256 }}
          CIWC_ARTIFACT_SET_SHA256: ${{ steps.finalize.outputs.artifact_set_sha256 }}
          CIWC_TARGET_GOOS: ${{ matrix.goos }}
          CIWC_TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = [IO.Path]::GetFullPath($env:CIWC_CONTROL_PATH)
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $item.Length -gt 4194304) { throw 'Invalid workflow control file.' }
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ($bytes.Length -gt 4194304 -or
              $actual -cne '171ce947eb2e5d49efcd89476e2031dcf82719484f9fc381bebe3df90760b22d') {
            throw 'Workflow control authentication failed.'
          }
          $source = (New-Object Text.UTF8Encoding($false, $true)).GetString($bytes)
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Workflow control parsing failed.' }
          & ([ScriptBlock]::Create($source)) `
            -Seal `
            -JobKind cross-build `
            -BaseRoot $env:CIWC_BASE `
            -ManifestSha256 $env:CIWC_MANIFEST_SHA256 `
            -ExpectedArtifactSetSha256 $env:CIWC_ARTIFACT_SET_SHA256 `
            -TargetGoos $env:CIWC_TARGET_GOOS `
            -TargetGoarch $env:CIWC_TARGET_GOARCH

  release-seal:
    name: Release proof seal
    needs:
      - permanent-gates
      - linux-quality
      - windows
      - linux-race
      - cross-build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every proof job and proof bit
        shell: pwsh
        env:
          PERMANENT_RESULT: ${{ needs.permanent-gates.result }}
          LINUX_QUALITY_RESULT: ${{ needs.linux-quality.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RACE_RESULT: ${{ needs.linux-race.result }}
          CROSS_BUILD_RESULT: ${{ needs.cross-build.result }}
          PERMANENT_PROOF: ${{ needs.permanent-gates.outputs.proof_complete }}
          LINUX_QUALITY_PROOF: ${{ needs.linux-quality.outputs.proof_complete }}
          WINDOWS_PROOF: ${{ needs.windows.outputs.proof_complete }}
          LINUX_RACE_PROOF: ${{ needs.linux-race.outputs.proof_complete }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $results = [ordered]@{
            permanent = $env:PERMANENT_RESULT
            linux_quality = $env:LINUX_QUALITY_RESULT
            windows = $env:WINDOWS_RESULT
            linux_race = $env:LINUX_RACE_RESULT
            cross_build = $env:CROSS_BUILD_RESULT
          }
          foreach ($entry in $results.GetEnumerator()) {
            if ($entry.Value -cne 'success') {
              throw "Release proof job failed: $($entry.Key)=$($entry.Value)"
            }
          }
          $proofs = [ordered]@{
            permanent = $env:PERMANENT_PROOF
            linux_quality = $env:LINUX_QUALITY_PROOF
            windows = $env:WINDOWS_PROOF
            linux_race = $env:LINUX_RACE_PROOF
          }
          foreach ($entry in $proofs.GetEnumerator()) {
            if ($entry.Value -cne 'true') {
              throw "Release proof is incomplete: $($entry.Key)=$($entry.Value)"
            }
          }
          Write-Host 'RELEASE_PROOF_SEAL_PASS'
