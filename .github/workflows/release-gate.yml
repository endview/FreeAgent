          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $probe = $runnerTemp
          while (-not [string]::IsNullOrWhiteSpace($probe)) {
            if (Test-Path -LiteralPath $probe) {
              $probeItem = Get-Item -LiteralPath $probe -Force
              if (($probeItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'Runner temp ancestry is not trusted.'
              }
            }
            $parent = [IO.Path]::GetDirectoryName($probe)
            if ([string]::IsNullOrWhiteSpace($parent) -or $parent -eq $probe) { break }
            $probe = $parent
          }
          $base = Join-Path $runnerTemp 'freeagent-release-job'
          if (Test-Path -LiteralPath $base) { throw 'Release workspace already exists.' }
          $controlDirectory = [IO.Directory]::CreateDirectory((Join-Path $base 'control')).FullName
          $snapshot = Join-Path $controlDirectory 'workflow-control.ps1'
          $stream = New-Object IO.FileStream(
            $snapshot,
            [IO.FileMode]::CreateNew,
            [IO.FileAccess]::Write,
            [IO.FileShare]::None
          )
          try {
            $stream.Write($bytes, 0, $bytes.Length)
            $stream.Flush($true)
          } finally { $stream.Dispose() }
          & $control `
            -Prepare `
            -JobKind linux-quality `
            -BaseRoot $base `
            -RepositoryRoot $env:GITHUB_WORKSPACE `
            -Revision $env:GITHUB_SHA `
            -GitHubOutputPath $env:GITHUB_OUTPUT `
            -GitHubEnvironmentPath $env:GITHUB_ENV

      - name: Initialize authenticated job evidence
        id: initialize
        shell: pwsh
        timeout-minutes: 5
        env:
          CIWC_CONTROL_PATH: ${{ steps.prepare.outputs.control }}
          CIWC_BASE: ${{ steps.prepare.outputs.base }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = [IO.Path]::GetFullPath($env:CIWC_CONTROL_PATH)
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $item.Length -gt 4194304) { throw 'Invalid workflow control file.' }
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ($bytes.Length -gt 4194304 -or
              $actual -cne '171ce947eb2e5d49efcd89476e2031dcf82719484f9fc381bebe3df90760b22d') {
            throw 'Workflow control authentication failed.'
          }
          $source = (New-Object Text.UTF8Encoding($false, $true)).GetString($bytes)
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { throw 'Workflow control parsing failed.' }
          & ([ScriptBlock]::Create($source)) `
            -Initialize -JobKind linux-quality -BaseRoot $env:CIWC_BASE

      - name: Set up Go from sealed go.mod
        id: setup
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ steps.prepare.outputs.stage }}/go.mod
          cache: false
          check-latest: false

      - name: Run authenticated Linux quality job
        id: run
        if: ${{ !cancelled() && steps.initialize.outcome == 'success' }}
        shell: pwsh
        env:
          CIWC_CONTROL_PATH: ${{ steps.prepare.outputs.control }}
          CIWC_BASE: ${{ steps.prepare.outputs.base }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = [IO.Path]::GetFullPath($env:CIWC_CONTROL_PATH)
          $item = Get-Item -LiteralPath $path -Force
          if (-not ($item -is [IO.FileInfo]) -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $item.Length -gt 4194304) { throw 'Invalid workflow control file.' }
          [byte[]]$bytes = [IO.File]::ReadAllBytes($path)
          $sha = [Security.Cryptography.SHA256]::Create()
          try {
            $actual = ([BitConverter]::ToString($sha.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant()
          } finally { $sha.Dispose() }
          if ($bytes.Length -gt 4194304 -or
              $actual -cne '171ce947eb2e5d49efcd89476e2031dcf82719484f9fc381bebe3df90760b22d') {
            throw 'Workflow control authentication failed.'
          }
          $source = (New-Object Text.UTF8Encoding($false, $true)).GetString($bytes)
          $tokens = $null
          $errors = $null
          [void][Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
