            -Finalize `
            -JobKind linux-quality `
            -BaseRoot $env:CIWC_BASE `
            -ManifestSha256 $env:CIWC_MANIFEST_SHA256 `
            -GitHubOutputPath $env:GITHUB_OUTPUT

      - name: Upload verified Linux ordinary evidence
        id: upload
        if: ${{ always() && steps.finalize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-linux-ordinary
          path: ${{ steps.prepare.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
          overwrite: false

      - name: Seal local artifact after upload attempt
        id: seal
        if: ${{ always() && steps.finalize.outcome == 'success' }}
        shell: pwsh
        timeout-minutes: 15
        env:
          CIWC_CONTROL_PATH: ${{ steps.prepare.outputs.control }}
          CIWC_BASE: ${{ steps.prepare.outputs.base }}
          CIWC_MANIFEST_SHA256: ${{ steps.prepare.outputs.manifest_sha256 }}
          CIWC_ARTIFACT_SET_SHA256: ${{ steps.finalize.outputs.artifact_set_sha256 }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $path = [IO.Path]::GetFullPath($env:CIWC_CONTROL_PATH)
          $item = Get-Item -LiteralPath $path -Force
