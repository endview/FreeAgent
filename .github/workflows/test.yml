name: Harness Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          package_json_file: internal/chatui/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: internal/chatui
      - run: pnpm test
        working-directory: internal/chatui
      - run: pnpm build
        working-directory: internal/chatui
      - run: git diff --exit-code -- internal/chatui/dist
      - run: go mod verify
      - run: go test -count=1 -timeout=5m -skip 'Live|RealProvider' ./...
      - run: go vet ./...
      - run: go build ./cmd/freeagent
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/update-notices.ps1 -Check
      - if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout=10m -skip 'Live|RealProvider' ./...
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          install: mingw-w64-x86_64-gcc
          update: true
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = 'C:\msys64\mingw64\bin;' + $env:PATH
          $env:CGO_ENABLED = '1'
          gcc --version
          go test -race -count=1 -timeout=10m -skip 'Live|RealProvider' ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
