name: Harness Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
        check: [standard, race]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.7'
      - run: python scripts/test_install_server.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          package_json_file: internal/chatui/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: internal/chatui
      - run: pnpm test
        working-directory: internal/chatui
      - run: pnpm typecheck
        working-directory: internal/chatui
      - run: pnpm lint
        working-directory: internal/chatui
      - run: pnpm build
        working-directory: internal/chatui
      - run: git diff --exit-code -- internal/chatui/dist
      - run: go mod verify
      - run: python scripts/check-core-boundaries.py
      - name: Prepare Windows PostgreSQL
        if: runner.os == 'Windows'
        run: python scripts/prepare-postgres.py --target windows-amd64 --cache output/pg-cache --out output/postgresql
      - name: Prepare Debian 12 PostgreSQL
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src debian:12-slim sh -ec 'apt-get update -qq && apt-get install -y --no-install-recommends build-essential zlib1g-dev python3 ca-certificates && python3 scripts/prepare-postgres.py --target linux-amd64 --cache output/pg-cache --out output/postgresql'
      - if: matrix.check == 'standard'
        run: python scripts/test-postgres.py --runtime output/postgresql -- go test -p 2 -count=1 -timeout=30m -skip 'Live|RealProvider' ./cmd/... ./internal/... ./examples/...
      - if: matrix.check == 'standard'
        run: go vet ./cmd/... ./internal/... ./examples/...
      - if: matrix.check == 'standard'
        run: go build ./cmd/freeagent
      - if: runner.os == 'Windows' && matrix.check == 'standard'
        shell: pwsh
        run: ./scripts/update-notices.ps1 -Check
      - if: runner.os == 'Linux' && matrix.check == 'race'
        run: python scripts/test-postgres.py --runtime output/postgresql -- go test -race -p 2 -count=1 -timeout=30m -skip 'Live|RealProvider' ./cmd/... ./internal/... ./examples/...
      - if: runner.os == 'Windows' && matrix.check == 'race'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          install: mingw-w64-x86_64-gcc
          update: true
      - if: runner.os == 'Windows' && matrix.check == 'race'
        shell: pwsh
        run: |
          $env:PATH = 'C:\msys64\mingw64\bin;' + $env:PATH
          $env:CGO_ENABLED = '1'
          gcc --version
          python scripts/test-postgres.py --runtime output/postgresql -- go test -race -p 2 -count=1 -timeout=45m -skip 'Live|RealProvider' ./cmd/... ./internal/... ./examples/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
